name: 🛠 Android CI / Build & Release APK

on:
  push:
    branches: [ main, UI/UX ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases on tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: ✅ Run tests
        run: flutter test --coverage

      - name: 🏗️ Build APK
        # Set a repo variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables)
        # to your deployed backend. The default only works on the Android emulator.
        run: >
          flutter build apk --release
          --dart-define=BACKEND_URL=${{ vars.BACKEND_URL || 'http://10.0.2.2:8000' }}

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend/artifacts/*.apk   # full path: working-directory doesn't apply to `uses:` steps

      - name: 🚀 Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/artifacts/*.apk
